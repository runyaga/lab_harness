[project]
name = "soliplex-lab-harness"
version = "0.4"
description = "Reusable machinery for measuring soliplex installation behavior"
readme = "README.md"
authors = [
    { name = "Tres Seaver", email = "tseaver@palladion.com" }
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# Deliberately empty. 'soliplex' is the software under test: an experiment
# pins it per code-axis value, so a pin here would fight the axis. Both it
# and 'logfire' are imported lazily by 'drive'.
dependencies = []

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["F", "E", "B", "UP", "I", "PD", "TRY", "PT"]

[tool.ruff.lint.isort]
force-single-line = true
